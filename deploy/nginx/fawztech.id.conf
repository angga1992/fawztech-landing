# nginx: fawztech.id dan www.fawztech.id → container landing (127.0.0.1:3000). Dipasang ke /etc/nginx/sites-available
# oleh scripts/deploy.sh; blok HTTPS dan redirect ditambahkan certbot (--nginx --redirect).
server {
    listen 80;
    listen [::]:80;
    server_name fawztech.id www.fawztech.id;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
